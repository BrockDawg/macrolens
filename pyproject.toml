[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
# Temporary for Checkpoint 1: macrolens.py has two lines over 120 columns.
# Checkpoint 2 (Task 4) removes this exclude when it rewrites the file.
extend-exclude = ["macrolens.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
per-file-ignores = { "macrolens.py" = ["E402"] }
